[agent]
id = "gargoyle-container"
queue_capacity = 4096

[agent.labels]
deployment = "container"
platform = "linux"

[collectors.process]
enabled = true
interval_ms = 1000
emit_existing = false
emit_stops = true
capture_command_line = false
max_command_line_bytes = 4096
max_processes = 65536

[collectors.network]
enabled = true
interval_ms = 2000
emit_existing = false
emit_closed = true
include_loopback = false
correlate_processes = true
fingerprint_processes = false
max_sockets = 262144
max_fds_per_process = 65536

[collectors.filesystem]
enabled = true
interval_ms = 3000
emit_existing = false
paths = [
  "/host/etc/passwd",
  "/host/etc/group",
  "/host/etc/shadow",
  "/host/etc/gshadow",
  "/host/etc/sudoers",
  "/host/etc/sudoers.d",
  "/host/etc/ssh",
  "/host/root/.ssh",
]
discover_home_ssh_keys = true
home_roots = ["/host/home"]
max_depth = 4
max_files = 10000

[collectors.identity]
enabled = true
interval_ms = 5000
emit_existing = false
max_accounts = 10000
linux_passwd_path = "/host/etc/passwd"
linux_group_path = "/host/etc/group"

[collectors.auth]
enabled = true
interval_ms = 2000
emit_existing = false
linux_log_paths = ["/host/var/log/auth.log", "/host/var/log/secure"]
max_read_bytes = 1048576
max_events_per_poll = 1024
windows_event_ids = [4624, 4625, 4648, 4672, 4688]

[collectors.fingerprint]
# Host executable paths do not necessarily resolve to host bytes inside the container.
enabled = false
hash_executables = true
windows_authenticode = false
max_file_bytes = 536870912
max_cache_entries = 4096

[collectors.kernel]
enabled = true
interval_ms = 5000
emit_existing = false

[collectors.health]
enabled = true
interval_ms = 60000

[output]
stdout = true
flush_each_event = true
