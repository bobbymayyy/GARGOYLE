[agent]
id = "gargoyle-windows-lab-01"
queue_capacity = 4096

[agent.labels]
environment = "lab"
role = "sensor"
platform = "windows"

[collectors.process]
enabled = true
interval_ms = 1000
emit_existing = false
emit_stops = true
capture_command_line = false
max_command_line_bytes = 4096
max_processes = 65536

[collectors.network]
enabled = true
interval_ms = 2000
emit_existing = false
emit_closed = true
include_loopback = false
correlate_processes = true
fingerprint_processes = true
max_sockets = 262144
max_fds_per_process = 65536

[collectors.filesystem]
enabled = true
interval_ms = 3000
emit_existing = false
paths = [
  'C:\Windows\System32\config\SAM',
  'C:\Windows\System32\config\SECURITY',
  'C:\Windows\System32\config\SYSTEM',
  'C:\Windows\System32\drivers\etc\hosts',
  'C:\ProgramData\ssh\sshd_config',
  'C:\ProgramData\ssh\administrators_authorized_keys',
]
discover_home_ssh_keys = true
home_roots = ['C:\Users']
max_depth = 4
max_files = 10000

[collectors.identity]
enabled = true
interval_ms = 5000
emit_existing = false
max_accounts = 10000
# Parsed only by Linux builds, retained for strict cross-platform config compatibility.
linux_passwd_path = "/etc/passwd"
linux_group_path = "/etc/group"

[collectors.auth]
enabled = true
interval_ms = 2000
emit_existing = false
linux_log_paths = []
max_read_bytes = 1048576
max_events_per_poll = 1024
windows_event_ids = [4624, 4625, 4648, 4672, 4688]

[collectors.fingerprint]
enabled = true
hash_executables = true
windows_authenticode = true
max_file_bytes = 536870912
max_cache_entries = 4096

[collectors.kernel]
enabled = false
interval_ms = 5000
emit_existing = false

[collectors.health]
enabled = true
interval_ms = 60000

[output]
stdout = false
file = 'C:\ProgramData\GARGOYLE\events.jsonl'
flush_each_event = true

[[policy.rules]]
name = "escalate-rdp-logons"
enabled = true
collector = "auth"
kind = "auth.login_success"
auth_logon_type = "remote_interactive"
action = "set_severity"
severity = "medium"

[policy.rules.add_labels]
control = "remote-access"

[[policy.rules]]
name = "escalate-failed-administrator-logons"
enabled = true
collector = "auth"
auth_account = "Administrator"
auth_outcome = "failure"
action = "set_severity"
severity = "high"
