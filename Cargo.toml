[package]
name = "gargoyle"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A hardened cross-platform telemetry and detection watchdog"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bobbymayyy/GARGOYLE"
readme = "README.md"
keywords = ["security", "telemetry", "incident-response", "monitoring", "windows"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
chrono = { version = "=0.4.41", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.5.41", features = ["derive"] }
ctrlc = "=3.4.7"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
toml = "=0.8.23"

[dev-dependencies]
tempfile = "=3.20.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
overflow-checks = true
strip = "symbols"

[profile.dev]
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
