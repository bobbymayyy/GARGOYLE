name: Bootstrap CI compile fix

on:
  push:
    branches:
      - agent/supply-chain-hardening

permissions:
  contents: write

jobs:
  fix-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Make socket owner map type explicit
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/platform/linux.rs")
          source = path.read_text()
          old = "    let mut owners = HashMap::new();"
          new = "    let mut owners: HashMap<u64, u32> = HashMap::new();"
          if old in source:
              path.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit("expected socket owner declaration not found")

      - name: Regenerate source integrity manifest
        shell: bash
        run: |
          git add -- src/platform/linux.rs
          git ls-files \
            | grep -vE '^(MANIFEST\.sha256|\.github/workflows/bootstrap-ci-fix\.yml)$' \
            | LC_ALL=C sort \
            | xargs sha256sum > MANIFEST.sha256

      - name: Commit fix
        shell: bash
        run: |
          git add -- src/platform/linux.rs MANIFEST.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make Linux socket owner map type explicit"
          git push
