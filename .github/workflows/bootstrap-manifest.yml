name: Bootstrap integrity manifest

on:
  push:
    branches:
      - agent/supply-chain-hardening

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Regenerate source integrity manifest
        shell: bash
        run: |
          git ls-files \
            | grep -vE '^(MANIFEST\.sha256|\.github/workflows/bootstrap-manifest\.yml)$' \
            | LC_ALL=C sort \
            | xargs sha256sum > MANIFEST.sha256

      - name: Commit manifest
        shell: bash
        run: |
          git add -- MANIFEST.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize source integrity manifest"
          git push
