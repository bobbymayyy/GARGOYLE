name: Dependency Integrity

on:
  pull_request:
    branches:
      - latest
  push:
    branches:
      - latest

permissions:
  contents: read

concurrency:
  group: dependency-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-build:
    name: Locked build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install project Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Reject known malicious packages before Cargo runs
        shell: python
        run: |
          import pathlib
          import tomllib

          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          packages = {(p["name"], p["version"]) for p in lock.get("package", [])}
          names = {name for name, _ in packages}

          blocked_versions = {
              ("arrayref", "0.3.10"),
              ("append-only-vec", "0.1.9"),
          }
          blocked_names = {"proc-macro1", "proc-macro-en"}

          found = sorted(blocked_versions & packages)
          found_names = sorted(blocked_names & names)
          if found or found_names:
              raise SystemExit(
                  f"blocked dependency detected: versions={found}, crates={found_names}"
              )

      - name: Verify Cargo.lock matches the manifest
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build with locked dependencies
        run: cargo build --locked --all-targets --all-features

      - name: Test with locked dependencies
        run: cargo test --locked --all-features

  dependency-policy:
    name: Advisory, license, and source policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install project Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install pinned cargo-deny
        run: cargo +1.97.1 install cargo-deny --version 0.20.2 --locked

      - name: Enforce dependency policy
        run: cargo +1.97.1 deny check advisories bans licenses sources
