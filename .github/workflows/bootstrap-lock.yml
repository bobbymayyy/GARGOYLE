name: Bootstrap dependency state

on:
  push:
    branches:
      - agent/supply-chain-hardening

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install project Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Generate dependency lockfile
        run: cargo +1.97.1 generate-lockfile

      - name: Regenerate source integrity manifest
        shell: bash
        run: |
          git add -- Cargo.lock
          git ls-files \
            | grep -vE '^(MANIFEST\.sha256|\.github/workflows/bootstrap-lock\.yml)$' \
            | LC_ALL=C sort \
            | xargs sha256sum > MANIFEST.sha256

      - name: Commit synchronized state
        shell: bash
        run: |
          git add -- Cargo.lock MANIFEST.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: synchronize dependency integrity state"
          git push
