name: Bootstrap Cargo.lock

on:
  push:
    branches:
      - agent/supply-chain-hardening

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Generate lockfile
        run: cargo +1.85.0 generate-lockfile

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock
          git commit -m "build: commit Cargo.lock"
          git push
